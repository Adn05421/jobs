<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>وظيفتي - بحث وتقديم</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f3;--card:#fff;--ink:#16302b;--mut:#5f7570;--line:#dbe4e0;--pri:#0f6b5c;--pri2:#e3f1ee;--acc:#e8a317;--ok:#2e8b57;--bar:#0f6b5c;--barink:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a18;--card:#172624;--ink:#e6f0ed;--mut:#93aaa4;--line:#27403b;--pri:#3cc2a8;--pri2:#16332e;--bar:#12332d;--barink:#e6f0ed}}
:root[data-theme="dark"]{--bg:#0f1a18;--card:#172624;--ink:#e6f0ed;--mut:#93aaa4;--line:#27403b;--pri:#3cc2a8;--pri2:#16332e;--bar:#12332d;--barink:#e6f0ed}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Tajawal',Tahoma,Arial,sans-serif;max-width:560px;margin-inline:auto;min-height:100vh;padding-bottom:84px}
header{background:var(--bar);color:var(--barink);padding:18px 16px 14px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header h1{margin:0 0 10px;font-size:22px;font-weight:800}
.sr{display:flex;gap:8px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 16px 2px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
main{padding:10px 16px}
.cnt{color:var(--mut);font-size:13px;margin:6px 2px 10px}
.job{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start}
.job.sel{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri2)}
.job input[type=checkbox]{width:20px;height:20px;margin-top:3px;accent-color:var(--pri)}
.job h3{margin:0;font-size:16px;font-weight:700}
.job .co{color:var(--mut);font-size:14px;margin-top:2px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;font-size:12px;color:var(--mut)}
.meta span{background:var(--pri2);color:var(--pri);padding:2px 8px;border-radius:6px}
.m{font-weight:800;font-size:15px;text-align:center;min-width:50px;color:var(--pri)}
.m small{display:block;font-weight:400;color:var(--mut);font-size:11px}
.row{grid-column:1/-1;display:flex;gap:8px}
.btn{border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer}
.p{background:var(--pri);color:#fff;flex:1}.s{background:var(--pri2);color:var(--pri)}
.done{background:var(--ok);color:#fff;flex:1;cursor:default}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav button{flex:1;background:none;border:0;padding:10px 0 8px;font:inherit;font-size:12px;color:var(--mut);cursor:pointer}
nav button.on{color:var(--pri);font-weight:800}
nav b{display:block;font-size:19px}
.bulk{position:fixed;bottom:calc(62px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:calc(100% - 28px);max-width:532px;z-index:7}
.bulk .btn{width:100%;background:var(--acc);color:#1b1500;padding:13px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow:auto}
.sheet h2{margin:0 0 4px;font-size:18px}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.st{font-size:12px;padding:3px 10px;border-radius:20px;background:var(--pri2);color:var(--pri);font-weight:700}
.lk{color:var(--pri);font-weight:700}.toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#16302b;color:#fff;padding:12px 16px;border-radius:12px;z-index:50;max-width:92%;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
nav b{font-size:17px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<header><h1 id="ttl">وظيفتي</h1>
<div class="sr" id="sr"><input id="q" type="search" placeholder="مثال: developer in Jeddah" aria-label="بحث"></div></header>
<div id="chips" class="chips"></div>
<main id="main"></main>
<div id="bulkw"></div>
<nav>
<button data-t="jobs" class="on"><b>💼</b>وظائف</button>
<button data-t="apps"><b>📨</b>طلباتي</button>
<button data-t="saved"><b>⭐</b>المحفوظة</button>
<button data-t="me"><b>👤</b>ملفي</button>
<button data-t="set"><b>⚙️</b>إعدادات</button>
</nav>
<div id="modal"></div>
<script>
const SAMPLE=[];
let J=SAMPLE;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={apps:{},saved:[],skills:"",name:"",phone:"",note:"",cfg:{},live:[],known:{}};
try{const r=localStorage.getItem("wz");if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem("wz",JSON.stringify(S))}catch(e){}};
if(S.live&&S.live.length)J=S.live;
const byId=id=>J.find(j=>j.id==id)||S.known[id];
const toast=t=>{const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),4500)};
function norm(x){const t=String(x.title||x.job_title||"").trim();if(!t)return null;const c=x.company||x.employer_name||"—";const sk=x.skills||x.job_required_skills;
const tags=(Array.isArray(sk)&&sk.length?sk:t.toLowerCase().split(/\s+/)).slice(0,6).map(v=>String(v).toLowerCase());
const url=x.url||x.link||x.job_apply_link||"";let h=0;for(const ch of t+c+url)h=(h*31+ch.charCodeAt(0))|0;
const dt=x.date||x.job_posted_at_datetime_utc;const d=dt?Math.max(0,Math.round((Date.now()-new Date(dt))/864e5)):0;
return{id:Math.abs(h)+1000,t,c,city:x.city||x.job_city||x.location||"—",type:x.type||x.job_employment_type||"—",mode:x.mode||(x.job_is_remote?"عن بعد":"حضوري"),tags,src:x.source||x.job_publisher||"—",d,url}}
async function fetchJobs(q){const c=S.cfg;let r;
if(c.jobProv==="own"){r=await fetch("https://api.openwebninja.com/jsearch/search?num_pages=1&country=sa&query="+encodeURIComponent(q),{headers:{"x-api-key":c.jobKey}})}
else if(c.jobProv==="custom"){r=await fetch(c.jobUrl.replace("{q}",encodeURIComponent(q)),{headers:c.jobKey?{Authorization:"Bearer "+c.jobKey}:{}})}
else{r=await fetch("https://jsearch.p.rapidapi.com/search?num_pages=1&query="+encodeURIComponent(q),{headers:{"X-RapidAPI-Key":c.jobKey,"X-RapidAPI-Host":"jsearch.p.rapidapi.com"}})}
if(!r.ok)throw new Error("HTTP "+r.status);const d=await r.json();const a=Array.isArray(d)?d:(d.data||d.jobs||d.results||[]);return a.map(norm).filter(Boolean)}
async function ai(prompt){const c=S.cfg;let r,d;
if(c.aiProv==="claude"){r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":c.aiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:600,messages:[{role:"user",content:prompt}]})});d=await r.json();if(!r.ok)throw new Error(d.error&&d.error.message||r.status);return d.content[0].text}
r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key="+encodeURIComponent(c.aiKey),{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({contents:[{parts:[{text:prompt}]}]})});d=await r.json();if(!r.ok)throw new Error(d.error&&d.error.message||r.status);return d.candidates[0].content.parts[0].text}
const NETERR=" — تأكد من المفتاح، ومن فتح الملف من جهازك أو استضافتك (الصفحة المنشورة على claude.ai تحجب الاتصال الخارجي)";
let tab="jobs",city="الكل",sel=new Set();
const cities=()=>["الكل",...new Set(J.map(j=>j.city).filter(Boolean))];
function match(j){const sk=S.skills.toLowerCase().split(/[,،\s]+/).filter(Boolean);if(!sk.length)return null;
const hit=j.tags.filter(t=>sk.some(s=>t.toLowerCase().includes(s)||s.includes(t.toLowerCase()))).length;return Math.round(hit/j.tags.length*100)}
function card(j){const m=match(j),ap=S.apps[j.id],sv=S.saved.includes(j.id);
return `<div class="job ${sel.has(j.id)?'sel':''}">
${ap?'<span></span>':`<input type="checkbox" aria-label="تحديد" data-sel="${j.id}" ${sel.has(j.id)?'checked':''}>`}
<div><h3>${esc(j.t)}</h3><div class="co">${esc(j.c)}</div>
<div class="meta"><span>${j.city}</span><span>${j.type}</span><span>${j.mode}</span><span>${j.src}</span><span>قبل ${j.d} يوم</span></div></div>
<div class="m">${m===null?'—':m+'%'}<small>مطابقة</small></div>
<div class="row">${ap?`<button class="btn done">✓ تم التقديم</button>`:`<button class="btn p" data-ap="${j.id}">قدّم الآن</button>`}
<button class="btn s" data-sv="${j.id}" aria-label="حفظ">${sv?'★':'☆'}</button></div></div>`}
function list(arr,empty){return arr.length?arr.map(card).join(""):`<div class="empty">${empty}</div>`}
function render(){
document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
$("#sr").style.display=tab==="jobs"?"flex":"none";
$("#ttl").textContent={jobs:"وظيفتي",apps:"طلباتي",saved:"المحفوظة",me:"ملفي",set:"الإعدادات"}[tab];
$("#chips").style.display=tab==="jobs"?"flex":"none";
if(tab==="jobs"){$("#chips").innerHTML=cities().map(c=>`<button class="chip ${c===city?'on':''}" data-city="${c}">${c}</button>`).join("");
const q=$("#q").value.trim().toLowerCase();
let r=J.filter(j=>(city==="الكل"||j.city===city)&&(!q||(j.t+j.c+j.tags.join(" ")).toLowerCase().includes(q)));
r.sort((a,b)=>(match(b)||0)-(match(a)||0)||a.d-b.d);
$("#main").innerHTML=(true?`<button class="btn p" id="fx" style="width:100%;margin-bottom:8px">🔄 جلب وظائف حقيقية: ${esc(q||"jobs in Saudi Arabia")}</button>`:"")+`<div class="cnt">${r.length} وظيفة${!S.skills.trim()&&r.length?' — أضف مهاراتك في «ملفي» لترتيب الوظائف حسب المطابقة':''}</div>`+list(r,J.length?"لا توجد نتائج. جرّب كلمة أخرى أو مدينة مختلفة.":"لا توجد وظائف بعد. أضف مفتاح الوظائف من «إعدادات» ثم اضغط «جلب وظائف حقيقية».")}
else if(tab==="apps"){const r=Object.keys(S.apps).map(byId).filter(Boolean);
$("#main").innerHTML=`<div class="cnt">${r.length} طلب مقدَّم</div>`+(r.length?r.map(j=>`<div class="job" style="grid-template-columns:1fr auto"><div><h3>${esc(j.t)}</h3><div class="co">${esc(j.c)} · ${j.city}</div><div class="meta"><span>قُدّم ${esc(S.apps[j.id])}</span>${j.url?`<a class="lk" href="${esc(j.url)}" target="_blank" rel="noopener">فتح رابط الوظيفة</a>`:""}</div></div><span class="st">قيد المراجعة</span></div>`).join(""):`<div class="empty">لم تقدّم على أي وظيفة بعد. حدّد عدة وظائف من الرئيسية وقدّم عليها دفعة واحدة.</div>`)}
else if(tab==="saved"){$("#main").innerHTML=list(S.saved.map(byId).filter(Boolean),"اضغط ☆ على أي وظيفة لحفظها هنا.")}
else if(tab==="set"){const c=S.cfg;$("#main").innerHTML=`<label>مصدر الوظائف</label><select id="jp"><option value="own">JSearch (OpenWeb Ninja)</option><option value="jsearch" ${c.jobProv==="jsearch"?"selected":""}>JSearch (RapidAPI)</option><option value="custom" ${c.jobProv==="custom"?"selected":""}>رابط مخصص</option></select>
<label>مفتاح الوظائف ${c.jobKey?"✅ محفوظ":"⚠️ غير محفوظ"}</label><input id="jk" type="password" dir="ltr" autocomplete="off" value="${esc(c.jobKey||"")}">
<label>الرابط المخصص (ضع {q} مكان كلمة البحث، ويرجع JSON)</label><input id="ju" dir="ltr" value="${esc(c.jobUrl||"")}" placeholder="https://example.com/jobs?q={q}">
<label>مزوّد الذكاء الاصطناعي</label><select id="ap"><option value="gemini">Gemini</option><option value="claude" ${c.aiProv==="claude"?"selected":""}>Claude</option></select>
<label>مفتاح الذكاء الاصطناعي ${c.aiKey?"✅ محفوظ":"(اختياري)"}</label><input id="ak" type="password" dir="ltr" autocomplete="off" value="${esc(c.aiKey||"")}">
<div class="row" style="margin-top:16px"><button class="btn p" id="ssv">حفظ الإعدادات</button></div>
<div class="row" style="margin-top:8px"><button class="btn s" id="tj" style="flex:1">اختبار الوظائف</button><button class="btn s" id="ta" style="flex:1">اختبار الذكاء</button></div>
<div class="row" style="margin-top:8px"><button class="btn s" id="clr" style="flex:1">مسح المفاتيح والوظائف المجلوبة</button></div>
<p class="cnt">المفاتيح تُحفظ في هذا الجهاز فقط. للاستخدام الشخصي، لا تشارك الملف وهو محمّل بمفاتيحك.</p>`}
else{$("#main").innerHTML=`<div id="phb" style="text-align:center;margin:6px 0 4px"></div><input type="file" id="phf" accept="image/*,.heic,.heif,.avif" style="display:none"><label>الاسم</label><input id="pn" value="${esc(S.name)}">
<label>رقم الجوال</label><input id="pp" inputmode="tel" value="${esc(S.phone)}">
<label>مهاراتك (افصل بينها بفاصلة)</label><input id="ps" value="${esc(S.skills)}" placeholder="python, excel, مبيعات">
<label>رسالة التقديم الافتراضية</label><textarea id="pt" rows="5" placeholder="السلام عليكم، أتقدم لوظيفة ...">${esc(S.note)}</textarea>
<button class="btn p" id="psv" style="width:100%;margin-top:16px">حفظ الملف</button>
<label style="margin-top:22px">السيرة الذاتية (PDF، Word، صورة، نص)</label>
<div id="cvl"></div>
<input type="file" id="cvf" multiple accept=".pdf,.doc,.docx,.txt,.rtf,.odt,.pages,image/*" style="display:none">
<button class="btn s" id="cva" style="width:100%;margin-top:8px">➕ رفع سيرة ذاتية</button>
<p class="cnt">تُحفظ السير على هذا الجهاز فقط (حتى 5 ملفات، كل ملف حتى 10 ميجابايت).</p>`}
bulk()}
function renderPhoto(){const el=$("#phb");if(!el)return;const has=!!S.photo;
el.innerHTML=`<div style="width:104px;height:104px;border-radius:50%;margin:0 auto 8px;background:var(--pri2);border:2px solid var(--pri);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:44px">${has?`<img src="${S.photo}" alt="الصورة الشخصية" style="width:100%;height:100%;object-fit:cover">`:"👤"}</div><div class="row" style="justify-content:center"><button class="btn s" id="phu">${has?"تغيير الصورة":"📷 رفع صورة شخصية"}</button>${has?'<button class="btn s" id="phd">حذف</button>':""}</div><p class="cnt" style="margin:6px 0 0">تدعم صيغ JPG وPNG وWebP وGIF وBMP وAVIF وSVG. تُحفظ على جهازك فقط.</p>`}
async function setPhoto(f){if(!f)return;if(!f.type.startsWith("image/")&&!/\.(jpe?g|png|webp|gif|bmp|avif|heic|heif|svg)$/i.test(f.name)){toast("هذا الملف ليس صورة");return}
if(f.size>20971520){toast("الصورة أكبر من 20 ميجابايت");return}
try{let b;try{b=await createImageBitmap(f)}catch(e){b=await new Promise((a,r)=>{const i=new Image();i.onload=()=>a(i);i.onerror=()=>r(new Error("decode"));i.src=URL.createObjectURL(f)})}
const w=b.width||b.naturalWidth,h=b.height||b.naturalHeight,m=Math.min(w,h),Z=360;const c=document.createElement("canvas");c.width=c.height=Z;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,Z,Z);x.drawImage(b,(w-m)/2,(h-m)/2,m,m,0,0,Z,Z);
S.photo=c.toDataURL("image/jpeg",0.85);save();toast("تم تحديث الصورة")}catch(e){toast(/heic|heif/i.test(f.name+f.type)?"صيغة HEIC غير مدعومة في متصفحك، حوّلها إلى JPG أو PNG ثم ارفعها":"تعذّر قراءة الصورة، جرّب صورة أخرى")}renderPhoto()}
const DB={o:null,open(){return this.o||(this.o=new Promise((a,b)=>{const r=indexedDB.open("wz-cv",1);r.onupgradeneeded=()=>r.result.createObjectStore("cv",{keyPath:"id"});r.onsuccess=()=>a(r.result);r.onerror=()=>b(r.error)}))},
async all(){const d=await this.open();return new Promise((a,b)=>{const q=d.transaction("cv").objectStore("cv").getAll();q.onsuccess=()=>a(q.result||[]);q.onerror=()=>b(q.error)})},
async put(x){const d=await this.open();return new Promise((a,b)=>{const t=d.transaction("cv","readwrite");t.objectStore("cv").put(x);t.oncomplete=a;t.onerror=()=>b(t.error)})},
async del(id){const d=await this.open();return new Promise((a,b)=>{const t=d.transaction("cv","readwrite");t.objectStore("cv").delete(id);t.oncomplete=a;t.onerror=()=>b(t.error)})}};
const CVX=["pdf","doc","docx","txt","rtf","odt","pages","jpg","jpeg","png","webp","heic","gif"];
function openCV(c){const u=URL.createObjectURL(c.blob);const a=document.createElement("a");a.href=u;a.target="_blank";a.rel="noopener";if(!/pdf|image|text\/plain/.test(c.type))a.download=c.name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}
async function addCV(fs){try{let n=(await DB.all()).length;for(const f of fs){const ext=(f.name.split(".").pop()||"").toLowerCase();
if(!CVX.includes(ext)&&!f.type.startsWith("image/")){toast("نوع غير مدعوم: "+f.name);continue}
if(f.size>10485760){toast("الملف أكبر من 10 ميجابايت: "+f.name);continue}
if(n>=5){toast("الحد الأقصى 5 سير ذاتية، احذف واحدة أولًا");break}
const id=Date.now()+Math.floor(Math.random()*999);await DB.put({id,name:f.name,type:f.type||"application/octet-stream",size:f.size,blob:f,date:new Date().toLocaleDateString("ar-SA")});if(!S.cvId||n===0){S.cvId=id;save()}n++;toast("تم رفع: "+f.name)}}catch(e){toast("تعذّر الحفظ في هذا المتصفح: "+e.message)}renderCV()}
async function renderCV(){const el=$("#cvl");if(!el)return;let a;try{a=await DB.all()}catch(e){el.innerHTML='<div class="cnt">التخزين غير متاح في هذا المتصفح.</div>';return}
el.innerHTML=a.length?a.map(c=>`<div class="job" style="grid-template-columns:1fr;margin-top:8px"><div><h3 style="font-size:14px;word-break:break-all">${c.type.startsWith("image/")?"🖼️":"📄"} ${esc(c.name)}</h3><div class="meta"><span>${Math.max(1,Math.round(c.size/1024))} KB</span><span>${esc(c.date)}</span>${S.cvId===c.id?"<span>الافتراضية ✓</span>":""}</div></div><div class="row"><button class="btn s" data-cvo="${c.id}" style="flex:1">فتح</button><button class="btn s" data-cvd="${c.id}" style="flex:1">الافتراضية</button><button class="btn s" data-cvx="${c.id}">حذف</button></div></div>`).join(""):'<div class="cnt">لم ترفع سيرة ذاتية بعد.</div>'}
async function cvBlock(){const el=$("#cvs");if(!el)return;let c;try{const a=await DB.all();c=a.find(x=>x.id===S.cvId)||a[0]}catch(e){}
el.innerHTML=c?`<div class="cnt">📎 السيرة الافتراضية: ${esc(c.name)}</div><button class="btn s" id="cvsh" style="width:100%">مشاركة السيرة (واتساب، إيميل...)</button>`:`<div class="cnt">ارفع سيرتك الذاتية من «ملفي» لتجدها هنا جاهزة للإرسال.</div>`;
if(c&&$("#cvsh"))$("#cvsh").onclick=async()=>{const f=new File([c.blob],c.name,{type:c.type});try{if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],text:$("#mt").value});else openCV(c)}catch(e){}}}
function bulk(){if(tab==="me"){renderCV();renderPhoto()}$("#bulkw").innerHTML=tab==="jobs"&&sel.size?`<div class="bulk"><button class="btn" id="bk">قدّم على ${sel.size} وظائف</button></div>`:""}
function confirmApply(ids){
if(!S.name||!S.phone){$("#modal").innerHTML=`<div class="modal"><div class="sheet"><h2>أكمل بياناتك أولًا</h2><label>الاسم</label><input id="mn" value="${esc(S.name)}"><label>رقم الجوال</label><input id="mp" inputmode="tel" value="${esc(S.phone)}"><div class="row" style="margin-top:16px"><button class="btn p" id="mok">متابعة</button><button class="btn s" id="mx">إلغاء</button></div></div></div>`;
$("#mok").onclick=()=>{S.name=$("#mn").value.trim();S.phone=$("#mp").value.trim();if(!S.name||!S.phone){$("#mn").focus();return}save();confirmApply(ids)};$("#mx").onclick=()=>$("#modal").innerHTML="";return}
const js=ids.map(byId).filter(Boolean);
$("#modal").innerHTML=`<div class="modal"><div class="sheet"><h2>تأكيد التقديم</h2><div class="cnt">${js.length} وظيفة بالاسم ${esc(S.name)}</div>${js.map(j=>`<div class="co">• ${esc(j.t)} — ${esc(j.c)}</div>`).join("")}
<div id="cvs"></div><label>رسالة التقديم</label>${S.cfg.aiKey?'<button class="btn s" id="mai" style="width:100%;margin-bottom:6px">✨ اكتب الرسالة بالذكاء الاصطناعي</button>':""}<textarea id="mt" rows="4">${esc(S.note||"السلام عليكم، أتقدم لهذه الوظيفة وأرى أن خبرتي تناسب متطلباتها. أرجو التواصل معي.")}</textarea>
<div class="row" style="margin-top:14px"><button class="btn p" id="mok">إرسال الطلبات</button><button class="btn s" id="mx">إلغاء</button></div></div></div>`;
$("#mx").onclick=()=>$("#modal").innerHTML="";
cvBlock();
if($("#mai"))$("#mai").onclick=async()=>{const b=$("#mai");b.textContent="جاري الكتابة...";try{$("#mt").value=await ai("اكتب رسالة تقديم وظيفي قصيرة وراقية بالعربية (5 أسطر كحد أقصى، بدون عناوين) تصلح للوظائف التالية: "+js.map(j=>j.t+" في "+j.c).join("، ")+". اسمي "+S.name+" ومهاراتي: "+(S.skills||"غير محددة")+".")}catch(e){toast("تعذّر الكتابة: "+e.message+NETERR)}b.textContent="✨ اكتب الرسالة بالذكاء الاصطناعي"};
$("#mok").onclick=()=>{const d=new Date().toLocaleDateString("ar-SA");js.forEach(j=>{S.apps[j.id]=d;S.known[j.id]=j});S.note=$("#mt").value;try{navigator.clipboard.writeText(S.note)}catch(e){}save();sel.clear();$("#modal").innerHTML="";if(js.some(j=>j.url))toast("تم التسجيل. افتح رابط كل وظيفة من «طلباتي» والصق الرسالة (نُسخت لجهازك)");render()}}
document.addEventListener("click",e=>{const t=e.target.closest("[data-t],[data-city],[data-ap],[data-sv],#bk,#psv,#fx,#ssv,#tj,#ta,#clr,#cva,#phu,#phd,[data-cvo],[data-cvd],[data-cvx]");if(!t)return;
if(t.dataset.t){tab=t.dataset.t;render()}
else if(t.dataset.city){city=t.dataset.city;render()}
else if(t.dataset.ap)confirmApply([+t.dataset.ap]);
else if(t.dataset.sv){const i=+t.dataset.sv;S.known[i]=byId(i);S.saved=S.saved.includes(i)?S.saved.filter(x=>x!==i):[...S.saved,i];save();render()}
else if(t.id==="bk")confirmApply([...sel]);
else if(t.id==="cva")$("#cvf").click();
else if(t.id==="phu")$("#phf").click();
else if(t.id==="phd"){S.photo="";save();renderPhoto()}
else if(t.dataset.cvo||t.dataset.cvd||t.dataset.cvx){const id=+(t.dataset.cvo||t.dataset.cvd||t.dataset.cvx);
if(t.dataset.cvd){S.cvId=id;save();renderCV()}
else DB.all().then(a=>{const c=a.find(x=>x.id===id);if(t.dataset.cvo&&c)openCV(c);else if(t.dataset.cvx)return DB.del(id).then(()=>{if(S.cvId===id){S.cvId=null;save()}renderCV()})}).catch(e=>toast("خطأ: "+e.message))}
else if(t.id==="fx"){if(!S.cfg.jobKey&&!S.cfg.jobUrl){toast("مفتاح الوظائف غير محفوظ. افتح «إعدادات» والصقه ثم احفظ");return}t.textContent="جاري الجلب...";fetchJobs($("#q").value.trim()||"jobs in Saudi Arabia").then(a=>{if(!a.length)throw new Error("لا نتائج");S.live=a;J=a;city="الكل";sel.clear();save();render()}).catch(e=>{toast(e.message==="لا نتائج"?"الاتصال ناجح لكن لا توجد نتائج. جرّب البحث بالإنجليزية مثل: developer in Jeddah":"تعذّر الجلب: "+e.message+NETERR);render()})}
else if(t.id==="ssv"||t.id==="tj"||t.id==="ta"){S.cfg={jobProv:$("#jp").value,jobKey:$("#jk").value.trim(),jobUrl:$("#ju").value.trim(),aiProv:$("#ap").value,aiKey:$("#ak").value.trim()};if(!S.cfg.jobKey&&/^ak_/.test(S.cfg.aiKey)){S.cfg.jobKey=S.cfg.aiKey;S.cfg.aiKey=""}save();
if(t.id==="ssv"){toast(S.cfg.jobKey?"تم حفظ الإعدادات ✅ مفتاح الوظائف محفوظ":"تم الحفظ، لكن مفتاح الوظائف فاضي");render()}
else if(t.id==="tj")fetchJobs("developer").then(a=>toast("نجح الاتصال: "+a.length+" وظيفة")).catch(e=>toast("فشل: "+e.message+NETERR));
else ai("قل: مرحبا").then(x=>toast("نجح الاتصال: "+x.slice(0,40))).catch(e=>toast("فشل: "+e.message+NETERR))}
else if(t.id==="clr"){S.cfg={};S.live=[];J=SAMPLE;save();render();toast("تم مسح المفاتيح والوظائف المجلوبة")}
else if(t.id==="psv"){S.name=$("#pn").value.trim();S.phone=$("#pp").value.trim();S.skills=$("#ps").value;S.note=$("#pt").value;save();t.textContent="✓ تم الحفظ";setTimeout(()=>t.textContent="حفظ الملف",1500)}});
document.addEventListener("change",e=>{if(e.target.id==="phf"){setPhoto(e.target.files[0]);e.target.value="";return}if(e.target.id==="cvf"){addCV([...e.target.files]);e.target.value="";return}const i=e.target.dataset.sel;if(i===undefined)return;e.target.checked?sel.add(+i):sel.delete(+i);render()});
$("#q").addEventListener("input",render);
render();
</script>
</body>
</html>
